[package]
name = "rusty_rtos_mqtt"
description = "Eleven proven slices of coreMQTT, remade in Rust, including EVERY PACKET A BROKER CAN SEND, the CONNECT that starts a session and the PUBLISH that carries data out: the QoS publish state machine, the fixed-header codec, the MQTT 5 property primitives, the outgoing-packet writers, the packet-size calculators, the acknowledgement deserializers, the CONNACK, the incoming PUBLISH, the DISCONNECT in both directions, the CONNECT and the outgoing PUBLISH across all three of its serializers. Each diffed against the C, comparing the state left behind and not only the answer. Zero allocation, no_std, forbid(unsafe). 33.8% of the library; the subscribe bodies and the connection machine are not written."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_rtos_mqtt"
keywords = ["rtos", "freertos", "embedded", "no-std", "remade-with-rust"]
categories = ["embedded", "no-std", "os"]

[features]
default = ["std"]
std = ["rusty_rtos_mqtt-core/std"]
alloc = ["rusty_rtos_mqtt-core/alloc"]

[dependencies]
rusty_rtos_mqtt-core = { workspace = true }

[lints]
workspace = true
