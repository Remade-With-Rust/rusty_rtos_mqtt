[package]
name = "rusty_rtos_mqtt"
description = "Twelve proven slices of coreMQTT, remade in Rust, including EVERY PACKET A BROKER CAN SEND and EVERY PACKET A CLIENT CAN SEND: the QoS publish state machine, the fixed-header codec, the MQTT 5 property primitives, the outgoing-packet writers, the packet-size calculators, the acknowledgement deserializers, the CONNACK, the incoming PUBLISH, the DISCONNECT in both directions, the CONNECT, the outgoing PUBLISH across all three of its serializers, and SUBSCRIBE, UNSUBSCRIBE, the acknowledgements and PINGREQ. Each diffed against the C, comparing the state left behind and not only the answer. Zero allocation, no_std, forbid(unsafe). 37.7% of the library: the whole wire codec, but not the connection machine that drives it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_rtos_mqtt"
keywords = ["rtos", "freertos", "embedded", "no-std", "remade-with-rust"]
categories = ["embedded", "no-std", "os"]

[features]
default = ["std"]
std = ["rusty_rtos_mqtt-core/std"]
alloc = ["rusty_rtos_mqtt-core/alloc"]

[dependencies]
rusty_rtos_mqtt-core = { workspace = true }

[lints]
workspace = true
