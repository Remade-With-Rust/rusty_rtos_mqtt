[package]
name = "rusty_rtos_mqtt"
description = "Two proven slices of coreMQTT, remade in Rust: the QoS publish state machine (diffed operation for operation, record arrays compared) and the fixed-header codec (diffed over 6,291,456 calls). Zero allocation, no_std, forbid(unsafe). The rest of the wire codec and the connection state machine are not written yet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_rtos_mqtt"
keywords = ["rtos", "freertos", "embedded", "no-std", "remade-with-rust"]
categories = ["embedded", "no-std", "os"]

[features]
default = ["std"]
std = ["rusty_rtos_mqtt-core/std"]
alloc = ["rusty_rtos_mqtt-core/alloc"]

[dependencies]
rusty_rtos_mqtt-core = { workspace = true }

[lints]
workspace = true
