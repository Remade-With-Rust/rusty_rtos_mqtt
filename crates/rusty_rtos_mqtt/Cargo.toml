[package]
name = "rusty_rtos_mqtt"
description = "The QoS publish state machine of coreMQTT, remade in Rust and diffed against the C operation for operation across 24 scenarios -- record arrays compared, not just statuses. Zero allocation, no_std, forbid(unsafe). The wire serializer and the connection state machine are not written yet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_rtos_mqtt"
keywords = ["rtos", "freertos", "embedded", "no-std", "remade-with-rust"]
categories = ["embedded", "no-std", "os"]

[features]
default = ["std"]
std = ["rusty_rtos_mqtt-core/std"]
alloc = ["rusty_rtos_mqtt-core/alloc"]

[dependencies]
rusty_rtos_mqtt-core = { workspace = true }

[lints]
workspace = true
