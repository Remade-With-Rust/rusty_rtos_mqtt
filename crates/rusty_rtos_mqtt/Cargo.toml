[package]
name = "rusty_rtos_mqtt"
description = "Twenty-one proven slices of coreMQTT, remade in Rust, including EVERY PACKET A BROKER CAN SEND and EVERY PACKET A CLIENT CAN SEND: the QoS publish state machine, the fixed-header codec, the MQTT 5 property primitives, the outgoing-packet writers, the packet-size calculators, the acknowledgement deserializers, the CONNACK, the incoming PUBLISH, the DISCONNECT in both directions, the CONNECT, the outgoing PUBLISH across all three of its serializers, SUBSCRIBE, UNSUBSCRIBE, the acknowledgements and PINGREQ, both readers of a packet header -- one off a socket, one out of a buffer, compared side by side -- the six outgoing property validators that say which property may go in which packet, the connection context every limit lives in, the MQTT 5 property builders and reader, the topic matcher -- whose 39x39 printed grid showed a wildcard filter silently missing a whole class of topic -- and the client context, where only the last entry in a subscription list turns out to decide whether the list is valid. Both core_mqtt_serializer.c and core_mqtt_prop_serializer.c are remade but for two logging functions -- and the builders are where the differential found a one-byte BUFFER OVERFLOW in the C, by being unable to reproduce it. Each diffed against the C, comparing the state left behind and not only the answer. Zero allocation, no_std, forbid(unsafe). 191 of coreMQTT's 218 functions (87.6%), counted from the pinned source by a checked-in script."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_rtos_mqtt"
keywords = ["rtos", "freertos", "embedded", "no-std", "remade-with-rust"]
categories = ["embedded", "no-std", "os"]

[features]
default = ["std"]
std = ["rusty_rtos_mqtt-core/std"]
alloc = ["rusty_rtos_mqtt-core/alloc"]

[dependencies]
rusty_rtos_mqtt-core = { workspace = true }

[lints]
workspace = true
